name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run test

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: industrial_maintenance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: industrial_maintenance_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      MQTT_HOST: localhost
      MQTT_PORT: 1883
      MQTT_SIMULATOR_PASSWORD: ci-only-dummy-simulator-password
      MQTT_BACKEND_PASSWORD: ci-only-dummy-backend-password
      JWT_SECRET: ci-only-dummy-secret-value-not-for-prod-use
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 7

    steps:
      - uses: actions/checkout@v4

      - name: Start Mosquitto
        run: |
          docker run -d --name mqtt -p 1883:1883 \
            -e MQTT_SIMULATOR_PASSWORD="$MQTT_SIMULATOR_PASSWORD" \
            -e MQTT_BACKEND_PASSWORD="$MQTT_BACKEND_PASSWORD" \
            -v ${{ github.workspace }}/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf \
            -v ${{ github.workspace }}/docker/mosquitto_acl.conf:/mosquitto/config/acl.conf \
            -v ${{ github.workspace }}/docker/mosquitto-entrypoint.sh:/mosquitto/config/mosquitto-entrypoint.sh \
            --entrypoint /bin/sh \
            eclipse-mosquitto:2 /mosquitto/config/mosquitto-entrypoint.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run test:e2e
